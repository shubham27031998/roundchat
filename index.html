<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roundchat | Production Defender</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #050505; 
            color: #00ff88; 
            font-family: 'Fira Code', monospace; 
            overflow: hidden; 
            user-select: none;
        }

        /* UI Overlays */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .hud { position: absolute; top: 20px; font-size: 20px; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        #score-board { left: 30px; }
        #high-score-board { right: 30px; color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.5); }
        
        /* Health Bar */
        #health-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: #1a1a1a;
        }
        #health-bar {
            width: 100%; height: 100%; background: #00ff88; transition: width 0.2s, background 0.3s;
            box-shadow: 0 0 20px #00ff88;
        }

        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(5px); z-index: 20;
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 { font-size: 4rem; color: #fff; text-shadow: 4px 4px 0px #00ff88; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 5px; text-align: center; }
        h2 { font-size: 1.5rem; color: #888; margin-bottom: 40px; font-weight: 400; }
        .btn {
            padding: 15px 40px; font-size: 1.5rem; color: #050505; background: #00ff88;
            border: none; cursor: pointer; font-family: 'Fira Code', monospace; font-weight: bold;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: transform 0.1s, background 0.2s;
            text-decoration: none; display: inline-block;
        }
        .btn:hover { background: #fff; transform: scale(1.05); }
        .social-link { margin-top: 20px; color: #fff; text-decoration: none; border-bottom: 1px solid #00ff88; padding-bottom: 2px; }
        
        /* Game Canvas */
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Heads Up Display -->
    <div id="ui-layer">
        <div id="score-board" class="hud">SCORE: <span id="score">0</span></div>
        <div id="high-score-board" class="hud">HIGH SCORE: <span id="high-score">0</span></div>
        <div id="health-container"><div id="health-bar"></div></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Roundchat</h1>
        <h2>Production Defender v1.0</h2>
        <button class="btn" onclick="startGame()">INITIALIZE SERVER</button>
        <p style="margin-top: 30px; color: #666;">Type the falling words to protect the mainframe.</p>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff0055; text-shadow: 4px 4px 0px #550022;">SYSTEM FAILURE</h1>
        <h2 id="final-score">Score: 0</h2>
        <button class="btn" onclick="resetGame()">REBOOT SYSTEM</button>
        <div style="margin-top: 40px; text-align: center;">
            <p style="color: #888; margin-bottom: 10px;">Server Maintenance Required.</p>
            <a href="https://instagram.com/roundchat" target="_blank" class="btn" style="background: #E1306C; color: white; font-size: 1rem; padding: 10px 25px;">Contact Admin @roundchat</a>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game State
    let score = 0;
    let health = 100;
    let isPlaying = false;
    let spawnRate = 2000;
    let lastSpawn = 0;
    let difficultyMultiplier = 1;
    let animationId;

    // DevOps Themed Word List
    const words = [
        "docker", "kubernetes", "sudo", "git", "python", "aws", "linux", "jenkins", "deploy", 
        "firewall", "nginx", "apache", "root", "ssh", "bash", "compile", "bug", "error", 
        "latency", "cache", "proxy", "token", "build", "merge", "commit", "push", "pull", 
        "status", "init", "remote", "branch", "origin", "master", "main", "dev", "prod", 
        "scale", "pod", "node", "cluster", "service", "ingress", "volume", "secret", "config"
    ];

    // Entities
    let activeWords = [];
    let particles = [];
    
    // Resize Canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // High Score Logic
    const highScoreEl = document.getElementById('high-score');
    let highScore = localStorage.getItem('roundchat_highscore') || 0;
    highScoreEl.innerText = highScore;

    class Word {
        constructor() {
            this.text = words[Math.floor(Math.random() * words.length)];
            this.x = Math.random() * (canvas.width - 200) + 100;
            this.y = -30;
            this.speed = (Math.random() * 1.5 + 0.5) * difficultyMultiplier;
            this.color = '#00ff88';
            this.matchedIndex = 0; // How many chars typed
        }

        draw() {
            ctx.font = 'bold 24px "Fira Code", monospace';
            
            // Draw matched part (Green)
            const matched = this.text.substring(0, this.matchedIndex);
            const remaining = this.text.substring(this.matchedIndex);
            
            const totalWidth = ctx.measureText(this.text).width;
            
            ctx.fillStyle = '#ff0055'; // Highlight Color
            ctx.fillText(matched, this.x, this.y);
            
            const matchedWidth = ctx.measureText(matched).width;
            ctx.fillStyle = '#00ff88'; // Normal Color
            ctx.fillText(remaining, this.x + matchedWidth, this.y);
        }

        update() {
            this.y += this.speed;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 6 - 3;
            this.speedY = Math.random() * 6 - 3;
            this.life = 1; // Opacity
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.02;
        }
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        
        const key = e.key.toLowerCase();
        
        // Find matching word
        let target = activeWords.find(w => w.text[w.matchedIndex] === key);
        
        if (target) {
            target.matchedIndex++;
            
            // Create typing particle effect
            const width = ctx.measureText(target.text.substring(0, target.matchedIndex)).width;
            particles.push(new Particle(target.x + width, target.y - 10, '#fff'));

            if (target.matchedIndex === target.text.length) {
                // Word Destroyed
                createExplosion(target.x, target.y);
                activeWords = activeWords.filter(w => w !== target);
                score += 10;
                updateScore();
                
                // Increase difficulty
                if (score % 50 === 0) {
                    difficultyMultiplier += 0.1;
                    spawnRate = Math.max(500, spawnRate - 100);
                }
            }
        }
    });

    function createExplosion(x, y) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x, y, '#ff0055'));
        }
    }

    function updateScore() {
        document.getElementById('score').innerText = score;
    }

    function updateHealth() {
        const bar = document.getElementById('health-bar');
        bar.style.width = health + '%';
        if (health < 30) bar.style.backgroundColor = '#ff0055';
        else bar.style.backgroundColor = '#00ff88';
        
        if (health <= 0) gameOver();
    }

    function spawnWord() {
        if (Date.now() - lastSpawn > spawnRate) {
            activeWords.push(new Word());
            lastSpawn = Date.now();
        }
    }

    function gameLoop() {
        if (!isPlaying) return;

        // Clear Screen
        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Trail effect
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update Words
        activeWords.forEach((word, index) => {
            word.update();
            word.draw();

            // Hit Floor
            if (word.y > canvas.height) {
                health -= 10;
                updateHealth();
                activeWords.splice(index, 1);
                
                // Screen Shake effect (Visual only)
                canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                setTimeout(() => canvas.style.transform = 'none', 50);
            }
        });

        // Update Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        spawnWord();
        animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        score = 0;
        health = 100;
        difficultyMultiplier = 1;
        spawnRate = 2000;
        activeWords = [];
        particles = [];
        isPlaying = true;
        
        updateScore();
        updateHealth();
        gameLoop();
    }

    function gameOver() {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('roundchat_highscore', highScore);
            document.getElementById('high-score').innerText = highScore;
        }

        document.getElementById('final-score').innerText = `Final Score: ${score}`;
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function resetGame() {
        startGame();
    }
</script>
</body>
</html>
