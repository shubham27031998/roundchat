<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUNDCHAT | High Performance Network</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #050505; color: #fff; font-family: 'Roboto', sans-serif; overflow-x: hidden; }

        /* --- LANDING PAGE STYLES --- */
        #landing-page {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 10; transition: opacity 0.5s;
        }
        .hero-content { z-index: 2; padding: 20px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 4rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px; background: linear-gradient(90deg, #00f260, #0575E6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #888; font-size: 1.2rem; margin-bottom: 40px; letter-spacing: 1px; }
        
        .play-btn {
            background: transparent; border: 2px solid #00f260; color: #00f260;
            padding: 15px 50px; font-size: 1.5rem; font-family: 'Orbitron', sans-serif; font-weight: bold;
            cursor: pointer; position: relative; overflow: hidden; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 96, 0.2); clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .play-btn:hover { background: #00f260; color: #000; box-shadow: 0 0 30px rgba(0, 242, 96, 0.6); transform: scale(1.05); }
        .play-btn::after { content: " >> START ENGINE"; }

        /* Social Link */
        .social-bar { margin-top: 50px; display: flex; gap: 20px; font-size: 0.9rem; color: #666; }
        .social-bar a { color: #fff; text-decoration: none; border-bottom: 1px solid #0575E6; transition: 0.3s; }
        .social-bar a:hover { color: #0575E6; }

        /* --- GAME UI LAYERS --- */
        #game-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
        canvas { display: block; width: 100%; height: 100%; }

        #hud { position: absolute; top: 20px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 20px; color: #fff; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        
        #game-over {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #ff0055; text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.4); border-radius: 10px; min-width: 300px;
        }
        #game-over h2 { font-family: 'Orbitron', sans-serif; color: #ff0055; font-size: 3rem; margin-bottom: 10px; }
        #game-over p { color: #fff; margin-bottom: 20px; font-size: 1.2rem; }
        .restart-btn { background: #ff0055; color: #fff; border: none; padding: 10px 30px; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; cursor: pointer; margin-bottom: 15px; }
        .restart-btn:hover { background: #fff; color: #ff0055; }
        
        .insta-link { display: block; color: #00f260; text-decoration: none; margin-top: 10px; font-size: 0.9rem; letter-spacing: 1px; }
        .insta-link:hover { text-decoration: underline; }

        /* Mobile Controls */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .control-key { display: none; width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; background: rgba(255,255,255,0.1); }
        @media (max-width: 768px) { .control-key { display: block; } h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>

    <!-- LANDING PAGE -->
    <div id="landing-page">
        <div class="hero-content">
            <h1>ROUNDCHAT</h1>
            <p class="subtitle">DEVOPS ENGINEERING | CLOUD ARCHITECTURE | AUTOMATION</p>
            <button class="play-btn" onclick="initGame()"></button>
            
            <div class="social-bar">
                <span>Follow the journey:</span>
                <a href="https://instagram.com/roundchat" target="_blank">@roundchat</a>
                <a href="#">GitHub</a>
                <a href="#">LinkedIn</a>
            </div>
        </div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container">
        <div id="hud">SCORE: <span id="scoreVal">0</span></div>
        <canvas id="gameCanvas"></canvas>
        
        <!-- Controls for Mobile -->
        <div class="controls">
            <div class="control-key" ontouchstart="moveLeft()" ontouchend="stopMove()"></div>
            <div class="control-key" ontouchstart="moveRight()" ontouchend="stopMove()"></div>
        </div>

        <!-- GAME OVER MODAL -->
        <div id="game-over">
            <h2>CRASHED</h2>
            <p>FINAL SCORE: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">RETRY RACE</button>
            <a href="https://instagram.com/roundchat" target="_blank" class="insta-link">Follow @roundchat on Instagram &rarr;</a>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const landing = document.getElementById('landing-page');
    const gameContainer = document.getElementById('game-container');
    const gameOverScreen = document.getElementById('game-over');
    
    // Game State
    let gameRunning = false;
    let score = 0;
    let speed = 5;
    let car = { x: 0, y: 0, w: 50, h: 80, color: '#00f260' };
    let obstacles = [];
    let roadLines = [];
    let keys = { ArrowLeft: false, ArrowRight: false };
    let animationFrame;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        car.x = canvas.width / 2 - 25;
        car.y = canvas.height - 120;
    }
    window.addEventListener('resize', resize);

    function initGame() {
        resize();
        landing.style.opacity = '0';
        setTimeout(() => {
            landing.style.display = 'none';
            gameContainer.style.display = 'block';
            startGame();
        }, 500);
    }

    function startGame() {
        gameRunning = true;
        score = 0;
        speed = 6;
        obstacles = [];
        roadLines = [];
        gameOverScreen.style.display = 'none';
        
        // Initial Road Lines
        for(let i=0; i<10; i++) {
            roadLines.push({ y: i * 100 });
        }
        
        loop();
    }

    function update() {
        score++;
        document.getElementById('scoreVal').innerText = Math.floor(score/10);

        // Increase Speed
        if(score % 500 === 0) speed += 1;

        // Move Car
        if (keys.ArrowLeft && car.x > 20) car.x -= 7;
        if (keys.ArrowRight && car.x < canvas.width - car.w - 20) car.x += 7;

        // Move Road Lines
        roadLines.forEach(line => {
            line.y += speed;
            if(line.y > canvas.height) line.y = -100;
        });

        // Spawn Obstacles
        if (Math.random() < 0.02) {
            let lane = Math.random() * (canvas.width - 100) + 50;
            obstacles.push({ x: lane, y: -100, w: 50, h: 80, color: '#ff0055' });
        }

        // Move & Check Obstacles
        obstacles.forEach((obs, index) => {
            obs.y += speed;
            
            // Collision Detection
            if (
                car.x < obs.x + obs.w &&
                car.x + car.w > obs.x &&
                car.y < obs.y + obs.h &&
                car.h + car.y > obs.y
            ) {
                endGame();
            }

            // Remove off-screen
            if(obs.y > canvas.height) obstacles.splice(index, 1);
        });
    }

    function draw() {
        // Clear background
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Road Effect
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        roadLines.forEach(line => {
            ctx.fillRect(canvas.width/2 - 5, line.y, 10, 60);
        });

        // Draw Player Car (Neon Style)
        ctx.shadowBlur = 20;
        ctx.shadowColor = car.color;
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.roundRect(car.x, car.y, car.w, car.h, 10);
        ctx.fill();
        
        // Car details
        ctx.fillStyle = '#000';
        ctx.fillRect(car.x + 5, car.y + 10, 40, 20); // Windshield

        // Draw Obstacles (Enemy Cars)
        obstacles.forEach(obs => {
            ctx.shadowColor = obs.color;
            ctx.fillStyle = obs.color;
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 10);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(obs.x + 5, obs.y + 50, 40, 10); // Rear lights
        });

        ctx.shadowBlur = 0; // Reset
    }

    function loop() {
        if (!gameRunning) return;
        update();
        draw();
        animationFrame = requestAnimationFrame(loop);
    }

    function endGame() {
        gameRunning = false;
        cancelAnimationFrame(animationFrame);
        document.getElementById('finalScore').innerText = Math.floor(score/10);
        gameOverScreen.style.display = 'block';
    }

    function restartGame() {
        startGame();
    }

    // Controls
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Mobile Logic
    function moveLeft() { keys.ArrowLeft = true; }
    function moveRight() { keys.ArrowRight = true; }
    function stopMove() { keys.ArrowLeft = false; keys.ArrowRight = false; }

</script>
</body>
</html>
